name: Crear APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Crear base Android y reconstruir desde PY o JSON
        run: |
          flutter create --platforms=android --org com.saycheese.agent --project-name saycheese_agent .
          python3 -c '
          import os, json, glob
          py_files = sorted(glob.glob("*.py"))
          json_files = sorted(glob.glob("*.json"))
          if json_files:
              data = json.load(open(json_files[-1], encoding="utf-8"))
              for path, content in data.items():
                  if os.path.dirname(path):
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                  open(path, "w", encoding="utf-8").write(content)
          elif py_files:
              exec(open(py_files[-1], encoding="utf-8").read())
          '

      - name: 5. Compilar APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: 6. Subir Instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-SayCheese-APK
          path: build/app/outputs/flutter-apk/app-release.apk
